name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/voice-module-pycache
        run: python3 -m py_compile client/voice_client.py backend/main.py backend/transcriber.py

      - name: Run Swift tests
        run: swift test --package-path macos/VoiceActivator
